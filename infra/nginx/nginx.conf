user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ==============================================================================
# STREAM BLOCK: SNI Multiplexing on Port 443 (Single IP Architecture)
# Distributes Port 443 traffic between Web/API (8443) and Coturn TURNS (5349)
# ==============================================================================
stream {
    map $ssl_preread_server_name $backend_pool {
        cn-bd-connect-turn.dpdns.org       coturn_tls;
        default                           web_api_https;
    }

    upstream coturn_tls {
        server host.docker.internal:5349;
    }

    upstream web_api_https {
        server 127.0.0.1:8443;
    }

    server {
        listen 443;
        proxy_pass $backend_pool;
        ssl_preread on;
    }
}

# ==============================================================================
# HTTP BLOCK: Web, API, WebSockets, and ACME Challenge Verification
# ==============================================================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Shared upstream targets
    upstream nextjs_web {
        server web:3000;
        keepalive 32;
    }

    upstream nestjs_api {
        server api:3001;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Port 80: HTTP to HTTPS Redirect & Let's Encrypt ACME Challenge
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name cn-bd-connect-app.shahmdmahi.dpdns.org
                    cn-bd-connect-api.shahmdmahi.dpdns.org
                    cn-bd-connect-turn.dpdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # Port 8443: Frontend Next.js PWA (cn-bd-connect-app.shahmdmahi.dpdns.org)
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name cn-bd-connect-app.shahmdmahi.dpdns.org;

        ssl_certificate /etc/letsencrypt/live/cn-bd-connect-app.shahmdmahi.dpdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cn-bd-connect-app.shahmdmahi.dpdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass http://nextjs_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Next.js static asset caching
        location /_next/static {
            proxy_pass http://nextjs_web;
            proxy_cache_bypass $http_upgrade;
            expires 365d;
            access_log off;
        }
    }

    # --------------------------------------------------------------------------
    # Port 8443: Backend API & WebSocket Signaling (cn-bd-connect-api.shahmdmahi.dpdns.org)
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        http2 on;
        server_name cn-bd-connect-api.shahmdmahi.dpdns.org;

        ssl_certificate /etc/letsencrypt/live/cn-bd-connect-api.shahmdmahi.dpdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cn-bd-connect-api.shahmdmahi.dpdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # REST API endpoints
        location /api/ {
            proxy_pass http://nestjs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WebSocket Signaling (/socket.io/)
        location /socket.io/ {
            proxy_pass http://nestjs_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Extended timeouts for WebRTC signaling persistence
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
