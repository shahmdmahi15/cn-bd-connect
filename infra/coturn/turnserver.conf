# ==============================================================================
# CN-BD Connect Production Coturn Server Configuration
# Optimized for China mainland <-> Bangladesh cross-border WebRTC traversal
# ==============================================================================

# Standard STUN/TURN Listening Ports
listening-port=3478
tls-listening-port=5349

# Alternate Ports (GFW Bypass: 443 Fallback for encrypted TLS media relay)
alt-listening-port=3479
alt-tls-listening-port=443

# Dedicated Relay Port Allocation (staying lean on 2GB RAM instance)
min-port=49152
max-port=49352

# Domain and Realm Definition
realm=cn-bd-connect-turn.shahmdmahi.dpdns.org
server-name=cn-bd-connect-turn

# Ephemeral Time-Limited Credentials via REST API (HMAC-SHA1)
use-auth-secret
static-auth-secret=cn-bd-connect-coturn-shared-secret-key-999

# Let's Encrypt TLS Certificates
cert=/etc/letsencrypt/live/cn-bd-connect-turn.shahmdmahi.dpdns.org/fullchain.pem
pkey=/etc/letsencrypt/live/cn-bd-connect-turn.shahmdmahi.dpdns.org/privkey.pem

# TLS Cipher Suite Configuration
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"

# Security & Traffic Hardening
fingerprint
stale-nonce=600
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1

# Logging directly to container output
verbose
